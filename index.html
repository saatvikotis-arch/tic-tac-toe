<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe Master</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header class="header">
      <div class="badge-tag">BATTLE GRID</div>
      <h1 class="title">TIC <span class="accent-red">TAC</span> TOE</h1>
      <p class="subtitle">Classic strategy in Crimson & Obsidian</p>
    </header>

    <!-- Controls & Settings Grid -->
    <div class="controls-card">
      <div class="control-item mode-control">
        <label for="game-mode">Mode</label>
        <select id="game-mode">
          <option value="pvp">👥 2 Players</option>
          <option value="pve" selected>🤖 vs AI</option>
        </select>
      </div>

      <div class="control-item diff-control" id="difficulty-wrapper">
        <label for="ai-difficulty">AI Level</label>
        <select id="ai-difficulty">
          <option value="easy">🌱 Easy</option>
          <option value="medium">⚡ Medium</option>
          <option value="hard" selected>🔥 Hard</option>
        </select>
      </div>

      <div class="control-item sound-control">
        <label>Audio</label>
        <button id="sound-toggle" class="icon-btn" aria-label="Toggle Sound" title="Toggle Sound">
          <svg id="sound-icon-on" class="sound-svg" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
          <svg id="sound-icon-off" class="sound-svg hidden" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
        </button>
      </div>
    </div>

    <!-- Scoreboard -->
    <div class="scoreboard">
      <div class="score-card player-x active-turn" id="score-x-card">
        <span class="player-label">Player X</span>
        <span class="score-value" id="score-x">0</span>
      </div>
      <div class="score-card tie-card">
        <span class="player-label">Draws</span>
        <span class="score-value" id="score-ties">0</span>
      </div>
      <div class="score-card player-o" id="score-o-card">
        <span class="player-label" id="player-o-label">AI (Player O)</span>
        <span class="score-value" id="score-o">0</span>
      </div>
    </div>

    <!-- Status Indicator -->
    <div class="status-container">
      <div class="status" id="status-text">Player <span class="current-turn x-turn">X</span>'s Turn</div>
    </div>

    <!-- Game Board -->
    <div class="board-wrapper">
      <div class="board" id="board" role="grid" aria-label="Tic Tac Toe Board">
        <div class="cell" data-index="0" role="gridcell" tabindex="0"></div>
        <div class="cell" data-index="1" role="gridcell" tabindex="0"></div>
        <div class="cell" data-index="2" role="gridcell" tabindex="0"></div>
        <div class="cell" data-index="3" role="gridcell" tabindex="0"></div>
        <div class="cell" data-index="4" role="gridcell" tabindex="0"></div>
        <div class="cell" data-index="5" role="gridcell" tabindex="0"></div>
        <div class="cell" data-index="6" role="gridcell" tabindex="0"></div>
        <div class="cell" data-index="7" role="gridcell" tabindex="0"></div>
        <div class="cell" data-index="8" role="gridcell" tabindex="0"></div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="actions">
      <button id="restart-btn" class="btn btn-primary">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        New Game
      </button>
      <button id="reset-score-btn" class="btn btn-secondary">
        Reset Scores
      </button>
    </div>

    <!-- Celebration Canvas -->
    <canvas id="confetti-canvas"></canvas>
  </div>

  <script src="script.js"></script>
</body>
</html>
